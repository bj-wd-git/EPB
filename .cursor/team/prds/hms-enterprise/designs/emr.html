<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMR — HMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
  <nav class="border-b bg-white px-6 py-3 shadow-sm"><span class="font-bold text-blue-700">HMS</span></nav>
  <main class="mx-auto max-w-4xl p-6">
    <div class="mb-4 flex items-center justify-between rounded-xl border bg-white p-4 shadow-sm">
      <div><h1 class="text-lg font-bold">Jane Doe</h1><p class="text-sm text-slate-500">HMS-BRN-000042 · F · 1990-01-15</p></div>
      <span class="rounded-full bg-amber-100 px-3 py-1 text-xs font-medium text-amber-800" role="alert">Penicillin allergy</span>
    </div>
    <div class="flex gap-2 border-b mb-4">
      <button class="border-b-2 border-blue-600 px-4 py-2 text-sm font-medium text-blue-600">Notes</button>
      <button class="px-4 py-2 text-sm text-slate-600">Allergies</button>
      <button class="px-4 py-2 text-sm text-slate-600">Vitals</button>
      <button class="px-4 py-2 text-sm text-slate-600">History</button>
    </div>
    <div class="rounded-xl border bg-white p-6 shadow-sm">
      <textarea class="w-full rounded-lg border px-3 py-2 text-sm" rows="4" placeholder="Clinical note..."></textarea>
      <button class="mt-3 rounded-lg bg-blue-600 px-4 py-2 text-sm text-white">Save Note</button>
    </div>
  </main>
</body>
</html>
