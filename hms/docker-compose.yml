services:
  mysql:
    image: mysql:8.0
    container_name: hms-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hms
      MYSQL_USER: hms
      MYSQL_PASSWORD: hms
    volumes:
      - hms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hms_mysql_data:
